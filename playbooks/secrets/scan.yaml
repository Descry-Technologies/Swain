id: secrets.scan
version: 1
author: swain
description: Detect hardcoded secrets, API keys, tokens, and credentials in source files.
worker: claude
output_schema: finding.v1
timeout_s: 90
applies_when: {}
files:
  include:
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.js"
    - "**/*.jsx"
    - "**/*.py"
    - "**/*.env*"
    - "**/*.yaml"
    - "**/*.yml"
    - "**/*.toml"
    - "**/*.json"
  exclude:
    - "**/node_modules/**"
    - "**/.git/**"
    - ".claude/**"
    - "**/.claude/**"
    - ".swain/**"
    - "**/.swain/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/*.lock"
    - "**/fixtures/**"
    - "**/tests/**"
    - "**/__tests__/**"
  max_files: 10
prompt: |
  {{learned_context}}

  You are auditing the following files for hardcoded secrets, credentials, and API keys.

  WHAT TO FIND:
  - API keys (OpenAI, Anthropic, Stripe, AWS, etc.) in source code (not in .env files)
  - Passwords or tokens assigned to variables in source code
  - Private keys or certificates embedded in code
  - Database connection strings with credentials in source code
  - OAuth client secrets hardcoded in source
  - JWT signing secrets hardcoded in source
  - AI provider keys exposed in client-side bundles (NEXT_PUBLIC_ prefix with sensitive values)

  WHAT TO IGNORE:
  - Placeholder values like "your-api-key-here", "REPLACE_ME", "xxx"
  - References to environment variables like process.env.STRIPE_KEY (this is correct)
  - Test fixtures clearly marked as fake
  - Example values in documentation comments

  ACCEPTED PATTERNS IN THIS REPO:
  {{accepted_patterns}}

  Read each of the following files using your file reading tools, then audit them:
  {{file_list}}

  For each finding, report:
  - The exact variable or line where the secret appears
  - The type of secret (OpenAI key, Stripe key, etc.)
  - Whether it appears in a file that would be shipped to the client
  - Confidence that this is a real secret (not a placeholder)

  Return JSON matching the finding.v1 schema. Set severity=critical for verified-looking keys,
  high for probable secrets, medium for possible secrets. Set confidence based on how certain
  you are this is a real credential vs a placeholder.
tests:
  - fixture: secrets_hardcoded_stripe_key.ts
    expect_finding_count: 1
    expect_rules: ["secrets.scan"]
  - fixture: secrets_env_reference_only.ts
    expect_finding_count: 0
