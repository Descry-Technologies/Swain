[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "descry"
version = "0.1.0"
description = "Autonomous AI security lead for vibe coders — runs on your existing Claude and Codex subscriptions"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "pydantic-settings>=2",
    "anyio>=4",
    "httpx>=0.27",
    "gitpython>=3.1",
    "PyYAML>=6",
    "jsonschema>=4",
    "aiofiles>=23",
    "filelock>=3",
    "tomli>=2; python_version < '3.11'",
    "tree-sitter>=0.23",
    "pygments>=2",
    "click>=8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
    "types-aiofiles",
]

[project.scripts]
descry = "descry.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/descry"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
