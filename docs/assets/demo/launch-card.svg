<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="swain launch card">
<defs>
  <filter id="glow"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.4"/></filter>
</defs>

<!-- background -->
<rect width="1200" height="630" fill="#102E2A"/>
<!-- subtle radial washes -->
<ellipse cx="200" cy="180" rx="380" ry="300" fill="#CDEC97" opacity="0.04"/>
<ellipse cx="1050" cy="500" rx="320" ry="260" fill="#2E726A" opacity="0.18"/>

<!-- outer card -->
<rect x="30" y="30" width="1140" height="570" rx="22" fill="#1A4A44" stroke="rgba(205,236,151,0.13)" stroke-width="1" filter="url(#sh)"/>
<!-- chartreuse top rule -->
<rect x="30" y="30" width="1140" height="3" rx="1.5" fill="#CDEC97" opacity="0.7"/>

<!-- ── aperture mark (40px, dark theme: ink=#CDEC97, pupil=#EBD183) ── -->
<g transform="translate(62,58) scale(0.4)">
  <!-- barrel ring -->
  <circle cx="50" cy="50" r="33" stroke="#CDEC97" stroke-width="4.4" fill="none"/>
  <!-- six blades -->
  <path d="M 50.00 37.00 L 25.02 30.98" stroke="#CDEC97" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M 61.26 43.50 L 53.98 18.85" stroke="#CDEC97" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M 61.26 56.50 L 78.97 37.88" stroke="#CDEC97" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M 50.00 63.00 L 74.98 69.02" stroke="#CDEC97" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M 38.74 56.50 L 46.02 81.15" stroke="#CDEC97" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M 38.74 43.50 L 21.03 62.12" stroke="#CDEC97" stroke-width="3.2" stroke-linecap="round"/>
  <!-- hex opening -->
  <path d="M 50.00 37.00 L 61.26 43.50 L 61.26 56.50 L 50.00 63.00 L 38.74 56.50 L 38.74 43.50 Z" stroke="#CDEC97" stroke-width="3.2" stroke-linejoin="round" fill="none"/>
  <!-- pupil -->
  <circle cx="50" cy="50" r="5.4" fill="#EBD183"/>
</g>

<!-- wordmark -->
<text x="104" y="84" fill="#CDEC97" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif" font-size="20" font-weight="600" letter-spacing="-0.03em">swain<tspan fill="#D2B65F">.</tspan></text>
<text x="104" y="100" fill="rgba(237,244,228,0.38)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif" font-size="11" font-weight="400" letter-spacing="0.1em">DESCRY LABS</text>

<!-- ── verdict block ── -->
<text x="62" y="200" fill="#E89B8E" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif" font-size="78" font-weight="700" letter-spacing="-0.04em">blocked.</text>
<text x="66" y="246" fill="rgba(237,244,228,0.85)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif" font-size="22" font-weight="400">fix launch blockers before shipping.</text>
<text x="66" y="286" fill="rgba(237,244,228,0.45)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif" font-size="16">launchpad-saas · react, fastapi, stripe</text>
<text x="66" y="308" fill="rgba(237,244,228,0.45)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif" font-size="16">auth · payments · uploads · tenant isolation</text>

<!-- ── stat boxes ── -->
<!-- findings -->
<rect x="720" y="60" width="156" height="106" rx="14" fill="#102E2A" stroke="rgba(205,236,151,0.13)" stroke-width="1"/>
<text x="798" y="125" fill="#CDEC97" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif" font-size="48" font-weight="700" text-anchor="middle" letter-spacing="-0.03em">5</text>
<text x="798" y="152" fill="rgba(237,244,228,0.4)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif" font-size="12" font-weight="500" text-anchor="middle" letter-spacing="0.08em">FINDINGS</text>
<!-- blockers -->
<rect x="894" y="60" width="156" height="106" rx="14" fill="#102E2A" stroke="rgba(232,155,142,0.22)" stroke-width="1"/>
<text x="972" y="125" fill="#E89B8E" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif" font-size="48" font-weight="700" text-anchor="middle" letter-spacing="-0.03em">5</text>
<text x="972" y="152" fill="rgba(237,244,228,0.4)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif" font-size="12" font-weight="500" text-anchor="middle" letter-spacing="0.08em">BLOCKERS</text>

<!-- ── fix first card ── -->
<rect x="700" y="186" width="410" height="210" rx="14" fill="#102E2A" stroke="rgba(205,236,151,0.13)" stroke-width="1"/>
<text x="724" y="220" fill="rgba(237,244,228,0.38)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif" font-size="11" font-weight="500" letter-spacing="0.12em">FIX FIRST</text>
<text x="958" y="220" fill="#E89B8E" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="end" letter-spacing="0.02em">bee77255</text>
<line x1="724" y1="230" x2="1086" y2="230" stroke="rgba(205,236,151,0.09)"/>
<text x="724" y="264" fill="rgba(237,244,228,0.92)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif" font-size="21" font-weight="500">checkout trusts client-</text>
<text x="724" y="292" fill="rgba(237,244,228,0.92)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif" font-size="21" font-weight="500">supplied price and tenant</text>
<text x="724" y="320" fill="rgba(237,244,228,0.92)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif" font-size="21" font-weight="500">metadata</text>
<text x="724" y="352" fill="rgba(237,244,228,0.36)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif" font-size="13">launch-risk · 94% · billing/checkout.py:15</text>
<text x="724" y="372" fill="rgba(237,244,228,0.36)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif" font-size="13">billing bypass possible before stripe validation</text>

<!-- ── next command bar ── -->
<rect x="62" y="476" width="1076" height="66" rx="12" fill="#0D2420" stroke="rgba(205,236,151,0.13)" stroke-width="1"/>
<text x="90" y="516" fill="#A9CC6A" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif" font-size="14" font-weight="600" letter-spacing="0.06em">NEXT</text>
<text x="148" y="516" fill="rgba(237,244,228,0.72)" font-family="SFMono-Regular,ui-monospace,Consolas,monospace" font-size="16">swain fix bee77255 --path examples/launchpad-saas</text>

<!-- ── footer ── -->
<text x="62" y="576" fill="rgba(237,244,228,0.25)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif" font-size="13">review-only patch drafts · no source edits applied</text>
<text x="1138" y="576" fill="rgba(237,244,228,0.25)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif" font-size="13" text-anchor="end">descry.app · apache-2.0</text>
</svg>